# Netlify Configuration for PHOTOBOOTH STUDIO
[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) Client Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control and security headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
